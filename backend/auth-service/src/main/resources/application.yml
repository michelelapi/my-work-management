server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5434/auth_service_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.myworkmanagement.authservice: DEBUG

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in milliseconds

db-backup:
  directory: db-backup
  use-docker: true
  docker-container: auth-service-db

google:
  drive:
    backup-folder-id: 1YCWnSmeJItnrq7M-QWJ0OQRTpfOW5rfo
    # Reuses company-service OAuth client + stored user token
    oauth-client-path: ../company-service/src/main/resources/google-drive-oauth-client.json
    token-directory: ../company-service/src/main/resources/google-drive-tokens