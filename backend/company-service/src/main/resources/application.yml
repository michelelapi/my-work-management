server:
  port: 8081

spring:
  application:
    name: company-service
  datasource:
    url: jdbc:postgresql://localhost:5433/company_service_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    enabled: true

logging:
  level:
    com.myworkmanagement.company: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in milliseconds

auth-service:
  url: http://localhost:8082
  validate-token-path: /api/auth/validate

db-backup:
  directory: db-backup
  use-docker: true
  docker-container: company-service-db

google:
  credentials-path: src/main/resources/google-sheets-credentials.json
  drive:
    # Personal Drive folder owned by your Google user (service accounts cannot upload to personal Drive).
    backup-folder-id: 1YCWnSmeJItnrq7M-QWJ0OQRTpfOW5rfo
    # Desktop OAuth client JSON from Google Cloud Console (one-time setup via GoogleDriveAuthSetup).
    oauth-client-path: src/main/resources/google-drive-oauth-client.json
    token-directory: src/main/resources/google-drive-tokens